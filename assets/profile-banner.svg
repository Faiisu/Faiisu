<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Sukum Decha — devices, data, and software</title>
  <desc id="desc">A colorful illustration of a device signal flowing into a data pipeline.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b3a"/>
      <stop offset="1" stop-color="#17204b"/>
    </linearGradient>
    <linearGradient id="signal" x2="1" y2="0">
      <stop stop-color="#5ce1e6"/>
      <stop offset=".55" stop-color="#b6f36a"/>
      <stop offset="1" stop-color="#ff8d78"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9cb8ee" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#background)"/>
